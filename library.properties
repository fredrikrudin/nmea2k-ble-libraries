name=nmea2k-ble-libraries
version=0.1.0
author=Fredrik Rudin
maintainer=Fredrik Rudin <fredrik.rudin@outlook.com>
sentence=NMEA 2000 over Bluetooth Low Energy: a CAN-bus bridge and a client that maps any PGN to your functions.
paragraph=An ESP32 on the NMEA 2000 bus streams every message (fast-packets reassembled) over BLE to up to 4 displays, each with its own PGN filter. On the display, handlers get a normal tN2kMsg, so all ParseN2k functions of the NMEA2000 library work unchanged. Modular: sending (TX) is a separate module.
category=Communication
url=https://github.com/fredrikrudin/nmea2k-ble-libraries
architectures=esp32
includes=N2kBle.h
depends=NimBLE-Arduino (>=2.3.0), NMEA2000-library
license=CC-BY-NC-4.0
